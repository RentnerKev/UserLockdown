name: CI

on:
  push:
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run format:check
      - run: bun run test
      - run: bun run build
      - run: git diff --exit-code -- css js
      - run: test -z "$(git status --porcelain --untracked-files=all -- css js)"

  php:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.2', '8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@7c071dfe9dc99bdf297fa79cb49ea005b9fcadbc # v2.37.1
        with:
          php-version: ${{ matrix.php-version }}
          coverage: none
          tools: composer:v2
      - run: composer validate --strict
      - run: composer install --no-interaction --prefer-dist
      - run: composer cs:check
      - run: composer phpstan
      - run: composer test

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        nextcloud-version: ['32', '33', '34']
    env:
      NEXTCLOUD_IMAGE: nextcloud:${{ matrix.nextcloud-version }}-apache
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run build
      - name: Pull integration images
        shell: bash
        run: |
          set -euo pipefail

          for service in db redis mailpit nextcloud; do
            for attempt in 1 2 3 4; do
              if docker compose pull "$service"; then
                break
              fi

              if (( attempt == 4 )); then
                echo "::error title=Docker image pull failed::Could not pull ${service} after 4 attempts."
                exit 1
              fi

              delay=$((10 * 2 ** (attempt - 1)))
              echo "::warning title=Docker image pull retry::Service ${service}, attempt ${attempt}/4 failed; retrying in ${delay}s."
              sleep "$delay"
            done
          done
      - run: docker compose up -d --wait --wait-timeout 600 --pull never db redis mailpit nextcloud
      - run: docker compose run --rm --pull never bootstrap
      - run: sh ./tests/integration/webdav-read-only.sh
      - if: always()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down --volumes
