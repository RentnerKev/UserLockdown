name: Build, sign, and publish release

on:
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

env:
  NEXTCLOUD_IMAGE: nextcloud:34-apache

jobs:
  verify:
    name: Verify release candidate
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  publish:
    name: Build, sign, and publish
    needs: verify
    environment: release
    outputs:
      previous_release_tag: ${{ steps.release_version.outputs.previous_release_tag }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
          ref: ${{ github.event.release.tag_name }}
      - name: Verify release tag checkout
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          release_ref="refs/tags/${RELEASE_TAG}"
          default_branch_ref="refs/remotes/origin/${DEFAULT_BRANCH}"
          git check-ref-format "${release_ref}"
          git check-ref-format "${default_branch_ref}"
          release_commit="$(git rev-parse --verify "${release_ref}^{commit}")"
          git show-ref --verify --quiet "${default_branch_ref}"
          test "$(git rev-parse HEAD)" = "${release_commit}"
          git tag --points-at HEAD |
            grep --fixed-strings --line-regexp --quiet -- "${RELEASE_TAG}"
          git merge-base --is-ancestor "${release_commit}" "${default_branch_ref}"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - uses: shivammathur/setup-php@7c071dfe9dc99bdf297fa79cb49ea005b9fcadbc # v2.37.1
        with:
          php-version: '8.5'
          coverage: none
      - name: Verify release version
        id: release_version
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail

          previous_release_tag=''
          release_list_arguments=(
            --exclude-drafts
            --limit 1000
            --repo "${GITHUB_REPOSITORY}"
            --json tagName,publishedAt
            --jq 'sort_by(.publishedAt) | reverse | .[].tagName'
          )
          if [[ "${RELEASE_PRERELEASE}" != 'true' ]]; then
            release_list_arguments+=(--exclude-pre-releases)
          fi
          mapfile -t published_tags < <(
            gh release list "${release_list_arguments[@]}"
          )
          for candidate in "${published_tags[@]}"; do
            if [[ "${candidate}" != "${RELEASE_TAG}" ]]; then
              previous_release_tag="${candidate}"
              break
            fi
          done

          php scripts/check-release-version.php \
            "${RELEASE_TAG}" \
            "${previous_release_tag}"
          printf 'previous_release_tag=%s\n' \
            "${previous_release_tag}" >> "${GITHUB_OUTPUT}"
      - run: bash ./scripts/package.sh --stage-only
      - run: git diff --exit-code -- css js
      - run: test -z "$(git status --porcelain --untracked-files=all -- css js)"
      - name: Pull signing images
        run: bash ./scripts/pull-compose-images.sh db redis nextcloud
      - name: Start signing server
        run: docker compose up -d --wait --wait-timeout 600 --pull never db redis nextcloud
      - name: Materialize signing secrets
        env:
          PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
          PUBLIC_CERTIFICATE: ${{ secrets.APP_PUBLIC_CRT }}
        run: |
          test -n "$PRIVATE_KEY"
          test -n "$PUBLIC_CERTIFICATE"
          mkdir -p build/signing
          printf '%s' "$PRIVATE_KEY" > build/signing/user_lockdown.key
          printf '%s' "$PUBLIC_CERTIFICATE" > build/signing/user_lockdown.crt
          chmod 600 build/signing/user_lockdown.key
          sudo chown -R 33:33 build/signing build/appstore
      - name: Sign staged production files
        run: |
          docker compose exec -T --user www-data nextcloud php occ integrity:sign-app \
            --privateKey=/var/www/html/custom_apps/user_lockdown/build/signing/user_lockdown.key \
            --certificate=/var/www/html/custom_apps/user_lockdown/build/signing/user_lockdown.crt \
            --path=/var/www/html/custom_apps/user_lockdown/build/appstore/user_lockdown
          sudo chown -R "$(id -u):$(id -g)" build/appstore
      - name: Archive signed application
        env:
          REQUIRE_SIGNATURE: '1'
        run: |
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          export SOURCE_DATE_EPOCH
          bash ./scripts/package.sh --archive-staged
          cd build
          sha256sum -c user_lockdown.tar.gz.sha256
      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          gh release upload "$RELEASE_TAG" \
            build/user_lockdown.tar.gz \
            build/user_lockdown.tar.gz.sha256 \
            --clobber
      - name: Publish to Nextcloud App Store
        if: ${{ !github.event.release.prerelease }}
        uses: R0Wi/nextcloud-appstore-push-action@ad2020a77eb694e8fe145d2ebd6bc21c246240fd # v1.0.5
        with:
          app_name: user_lockdown
          appstore_token: ${{ secrets.APPSTORE_TOKEN }}
          download_url: https://github.com/${{ github.repository }}/releases/download/${{ github.event.release.tag_name }}/user_lockdown.tar.gz
          app_private_key: ${{ secrets.APP_PRIVATE_KEY }}
          nightly: false
      - if: always()
        name: Remove signing material
        run: |
          sudo chown -R "$(id -u):$(id -g)" build/appstore 2>/dev/null || true
          sudo rm -f build/signing/user_lockdown.key build/signing/user_lockdown.crt
          rm -f "$GITHUB_WORKSPACE/user_lockdown.key" "$GITHUB_WORKSPACE/user_lockdown.crt"
          docker compose down --volumes

  changelog:
    name: Publish release changelog
    needs: publish
    permissions:
      contents: write
    uses: ./.github/workflows/changelog.yml
    with:
      prerelease: ${{ github.event.release.prerelease }}
      previous_release_tag: ${{ needs.publish.outputs.previous_release_tag }}
      published_at: ${{ github.event.release.published_at }}
      release_tag: ${{ github.event.release.tag_name }}
