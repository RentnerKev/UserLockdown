name: Documentation improvement
description: Report missing, unclear, or incorrect documentation.
title: "[Docs]: "
labels: [documentation, needs-triage]
body:
  - type: input
    id: location
    attributes:
      label: Page or section
      placeholder: "e.g. README.md#local-development"
    validations:
      required: true
  - type: textarea
    id: issue
    attributes:
      label: What needs to change?
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: Suggested wording or example
    validations:
      required: false
