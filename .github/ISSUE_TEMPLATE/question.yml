name: Question
description: Ask about setup, supported versions, or expected behavior.
title: "[Question]: "
labels: [question, needs-triage]
body:
  - type: textarea
    id: question
    attributes:
      label: Your question
      description: Include the User Lockdown and Nextcloud versions if relevant.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: What have you tried?
    validations:
      required: false
