name: user-lockdown-dev

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: nextcloud
      POSTGRES_USER: nextcloud
      POSTGRES_PASSWORD: nextcloud-dev-db-password
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U nextcloud -d nextcloud']
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - redis_data:/data

  mailpit:
    image: axllent/mailpit:v1.27
    restart: unless-stopped
    ports:
      - '1025:1025'
      - '8025:8025'

  nextcloud:
    image: ${NEXTCLOUD_IMAGE:-nextcloud:34-apache}
    restart: unless-stopped
    ports:
      - '${NEXTCLOUD_PORT:-8080}:80'
    environment:
      POSTGRES_HOST: db
      POSTGRES_DB: nextcloud
      POSTGRES_USER: nextcloud
      POSTGRES_PASSWORD: nextcloud-dev-db-password
      REDIS_HOST: redis
      NEXTCLOUD_ADMIN_USER: admin
      NEXTCLOUD_ADMIN_PASSWORD: admin-dev-password
      NEXTCLOUD_TRUSTED_DOMAINS: localhost 127.0.0.1
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      MAIL_FROM_ADDRESS: nextcloud
      MAIL_DOMAIN: user-lockdown.test
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - 'su -s /bin/sh www-data -c "php /var/www/html/occ status --output=json" | grep -q ''"installed":true'''
      interval: 10s
      timeout: 10s
      retries: 60
      start_period: 30s
    volumes:
      - nextcloud_html:/var/www/html
      - ./:/var/www/html/custom_apps/user_lockdown:rw

  bootstrap:
    image: ${NEXTCLOUD_IMAGE:-nextcloud:34-apache}
    restart: 'no'
    depends_on:
      nextcloud:
        condition: service_healthy
    environment:
      RESTRICTED_USER_PASSWORD: restricted-dev-password
      NORMAL_USER_PASSWORD: normal-dev-password
    entrypoint: ['/bin/sh', '/workspace/docker/bootstrap.sh']
    volumes:
      - nextcloud_html:/var/www/html
      - ./:/var/www/html/custom_apps/user_lockdown:rw
      - ./:/workspace:ro

volumes:
  nextcloud_html:
  postgres_data:
  redis_data:
